    document.getElementById("exportBtn").addEventListener("click", exportData);

    const GDRIVE_CLIENT_ID_KEY = "gdrive-client-id";

    document.getElementById("exportGDriveBtn").addEventListener("click", function () {
      const storedClientId = window.localStorage.getItem(GDRIVE_CLIENT_ID_KEY);
      showGDriveModal(storedClientId);
    });

    function showGDriveModal(storedClientId) {
      const overlay = document.createElement("div");
      overlay.className = "gdrive-modal-overlay";

      const modal = document.createElement("div");
      modal.className = "gdrive-modal";

      modal.innerHTML = `
        <h3>导出到 Google Drive</h3>
        <p style="text-align:left;font-size:12px;line-height:1.6;margin-bottom:12px;">
          请先在 <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color:#4285f4;">Google Cloud Console</a> 完成以下设置：<br>
          1. 启用 <a href="https://console.developers.google.com/apis/api/drive.googleapis.com/overview" target="_blank" style="color:#4285f4;">Google Drive API</a><br>
          2. 创建 OAuth 2.0 客户端 ID，类型选 <b>Web 应用</b><br>
          3. 在"已获授权的 JavaScript 来源"添加 <code style="font-size:11px;">https://chenjiamian.github.io</code><br>
          4. 复制客户端 ID 粘贴到下方
        </p>
        ${!storedClientId ? '<input id="gdriveClientIdInput" type="text" placeholder="例如: 123456-xxx.apps.googleusercontent.com">' : ""}
        <div class="gdrive-modal-buttons">
          ${storedClientId ? '<button class="gdrive-modal-btn cancel-btn" id="gdriveResetBtn" style="background:#d14b38;color:#fff;">重置ID</button>' : ""}
          <button class="gdrive-modal-btn cancel-btn" id="gdriveCancelBtn">取消</button>
          <button class="gdrive-modal-btn confirm-btn" id="gdriveConfirmBtn">${storedClientId ? "确认导出" : "保存并授权"}</button>
        </div>
      `;

      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      document.getElementById("gdriveCancelBtn").addEventListener("click", function () {
        document.body.removeChild(overlay);
      });

      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) {
          document.body.removeChild(overlay);
        }
      });

      const resetBtn = document.getElementById("gdriveResetBtn");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          window.localStorage.removeItem(GDRIVE_CLIENT_ID_KEY);
          document.body.removeChild(overlay);
          showGDriveModal(null);
        });
      }

      document.getElementById("gdriveConfirmBtn").addEventListener("click", function () {
        let clientId = storedClientId;
        if (!clientId) {
          clientId = document.getElementById("gdriveClientIdInput").value.trim();
          if (!clientId) {
            alert("请输入有效的 Client ID");
            return;
          }
          window.localStorage.setItem(GDRIVE_CLIENT_ID_KEY, clientId);
        }
        document.body.removeChild(overlay);
        exportToGoogleDrive(clientId);
      });
    }

    function exportToGoogleDrive(clientId) {
      if (typeof google === "undefined" || !google.accounts) {
        alert("Google API 尚未加载完成，请稍后重试");
        return;
      }
      const SCOPES = "https://www.googleapis.com/auth/drive.file";
      const data = {
        unitMinutes: loadStoredUnitMinutes(),
        birthDate: window.localStorage.getItem(BIRTH_STORAGE_KEY),
        zones: zones,
        countdowns: countdowns,
        cardOrder: getCurrentCardOrder(),
        exportTime: new Date().toISOString()
      };
      const jsonStr = JSON.stringify(data, null, 2);
      const fileName = "workday-dashboard-backup-" + new Date().toISOString().slice(0, 10) + ".json";

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPES,
        callback: function (response) {
          if (response.error) {
            alert("授权失败: " + response.error);
            return;
          }
          uploadToDrive(response.access_token, jsonStr, fileName);
        }
      });

      tokenClient.requestAccessToken();
    }

    function uploadToDrive(accessToken, content, fileName) {
      const metadata = {
        name: fileName,
        mimeType: "application/json"
      };

      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
      form.append("file", new Blob([content], { type: "application/json" }));

      fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: new Headers({ Authorization: "Bearer " + accessToken }),
        body: form
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.id) {
            alert("导出成功！文件已保存到 Google Drive");
          } else {
            alert("导出失败: " + (data.error ? data.error.message : "未知错误"));
          }
        })
        .catch(function (e) {
          alert("导出失败: " + e.message);
        });
    }

    document.getElementById("importGDriveBtn").addEventListener("click", function () {
      const storedClientId = window.localStorage.getItem(GDRIVE_CLIENT_ID_KEY);
      if (!storedClientId) {
        alert("请先点击\"导出到Google Drive\"按钮配置 Client ID");
        return;
      }
      importFromGoogleDrive(storedClientId);
    });

    function importFromGoogleDrive(clientId) {
      if (typeof google === "undefined" || !google.accounts) {
        alert("Google API 尚未加载完成，请稍后重试");
        return;
      }
      const SCOPES = "https://www.googleapis.com/auth/drive.readonly";

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPES,
        callback: function (response) {
          if (response.error) {
            alert("授权失败: " + response.error);
            return;
          }
          listDriveFiles(response.access_token);
        }
      });

      tokenClient.requestAccessToken();
    }

    function listDriveFiles(accessToken) {
      const query = "name contains 'workday-dashboard-backup' and mimeType = 'application/json'";
      fetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(query) + "&orderBy=createdTime desc&pageSize=10&fields=files(id,name,createdTime)", {
        method: "GET",
        headers: new Headers({ Authorization: "Bearer " + accessToken })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.files || data.files.length === 0) {
            alert("未找到备份文件");
            return;
          }
          showFilePickerModal(data.files, accessToken);
        })
        .catch(function (e) {
          alert("获取文件列表失败: " + e.message);
        });
    }

    function showFilePickerModal(files, accessToken) {
      const overlay = document.createElement("div");
      overlay.className = "gdrive-modal-overlay";

      const modal = document.createElement("div");
      modal.className = "gdrive-modal";

      const title = document.createElement("h3");
      title.textContent = "选择要导入的文件";

      const fileList = document.createElement("div");
      fileList.className = "gdrive-file-list";

      files.forEach(function (f) {
        const date = new Date(f.createdTime).toLocaleString("zh-CN");

        const item = document.createElement("div");
        item.className = "gdrive-file-item";
        item.dataset.fileId = f.id;

        const nameEl = document.createElement("div");
        nameEl.className = "gdrive-file-name";
        nameEl.textContent = f.name;

        const dateEl = document.createElement("div");
        dateEl.className = "gdrive-file-date";
        dateEl.textContent = date;

        item.appendChild(nameEl);
        item.appendChild(dateEl);
        fileList.appendChild(item);
      });

      const buttonRow = document.createElement("div");
      buttonRow.className = "gdrive-modal-buttons";

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "gdrive-modal-btn cancel-btn";
      cancelBtn.id = "gdriveCancelBtn";
      cancelBtn.type = "button";
      cancelBtn.textContent = "取消";

      buttonRow.appendChild(cancelBtn);
      modal.appendChild(title);
      modal.appendChild(fileList);
      modal.appendChild(buttonRow);

      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      cancelBtn.addEventListener("click", function () {
        document.body.removeChild(overlay);
      });

      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) {
          document.body.removeChild(overlay);
        }
      });

      modal.querySelectorAll(".gdrive-file-item").forEach(function (item) {
        item.addEventListener("click", function () {
          const fileId = this.dataset.fileId;
          document.body.removeChild(overlay);
          downloadFileFromDrive(accessToken, fileId);
        });
      });
    }

    function downloadFileFromDrive(accessToken, fileId) {
      fetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media", {
        method: "GET",
        headers: new Headers({ Authorization: "Bearer " + accessToken })
      })
        .then(function (res) { return res.text(); })
        .then(function (content) {
          importData(content);
        })
        .catch(function (e) {
          alert("下载文件失败: " + e.message);
        });
    }

    document.getElementById("importBtn").addEventListener("click", function () {
      document.getElementById("importInput").click();
    });

    document.getElementById("importInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        importData(event.target.result);
      };
      reader.readAsText(file);
      e.target.value = "";
    });
  </script>
